# Piper Upper 机械臂配置文件
# 用法: python workspace_analyzer.py piper_upper.yaml

arm:
  group: "arm"
  can_port: "piper_upper"
  eye_position: [0.85, 0.00, -0.10]   # 人眼/相机在基座坐标系中的位置 (x, y, z) 米
  planning_timeout: 0.05
  hard_timeout: 0.05
  yaw_step: 10.0
  yaw_levels: 3
  pitch_step: 5.0
  pitch_range: 20.0

safety_bbox:
  x: [-0.4, 0.7]
  y: [-0.4, 0.4]
  z: [0.0, 0.50]

obstacles:
  - name: "cams"
    x: [0.08, 0.25]
    y: [-0.30, 0.30]
    z: [0.00, 0.12]
  - name: "upper_pillar"
    x: [-0.40, 0.00]
    y: [-0.15, 0.15]
    z: [0.47, 0.50]
  - name: "left_pillar"
    x: [0.00, 0.10]
    y: [-0.40, -0.30]
    z: [0.00, 0.20]
  - name: "right_pillar"
    x: [0.00, 0.10]
    y: [0.30, 0.40]
    z: [0.00, 0.20]
  - name: "left_IR"
    x: [0.00, 0.20]
    y: [-0.40, -0.28]
    z: [0.00, 0.30]
  - name: "right_IR"
    x: [0.00, 0.20]
    y: [0.28, 0.40]
    z: [0.00, 0.30]

workspace_analysis:
  sampling_box:
    x: [0.0, 0.7]
    y: [-0.3, 0.3]
    z: [0.1, 0.5]
  resolution: 0.05

# 末端工具相对于法兰盘的偏置 (先旋转 Z-X-Z', 再平移)
# 末端工具相对于法兰盘的偏置 (先旋转 Z-X-Z', 再平移)
tool:
  translation: [0.0, 0.0, 0.02]     # 米, 法兰盘坐标系
  rotation_zxz: [0.0, 0.0, 45.0]    # 度, 内旋 Z-X-Z' (α, β, γ)

# 机械臂基座在相机坐标系中的位姿 (先旋转 Z-X-Z', 再平移)
arm_in_ccs:
  translation: [0.0, 0.0, 0.0]      # 米
  rotation_zxz: [0.0, 90.0, 90.0]  # 度, 内旋 Z-X-Z' (α, β, γ)
