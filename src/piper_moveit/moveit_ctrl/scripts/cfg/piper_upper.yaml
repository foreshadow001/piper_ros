# Piper Upper 机械臂配置文件
# 用法: python workspace_analyzer.py piper_upper.yaml

arm:
  group: "arm"
  can_port: "piper_upper"
  eye_position: [1.0, 0.0, 0.0]   # 人眼/相机在基座坐标系中的位置 (x, y, z) 米
  planning_timeout: 0.05
  hard_timeout: 0.05
  yaw_step: 10.0
  yaw_levels: 3
  pitch_step: 5.0
  pitch_range: 20.0

safety_bbox:
  x: [-0.4, 0.8]
  y: [-0.5, 0.5]
  z: [0.0, 0.6]

obstacles:
  - name: "left_pillar"
    x: [0.06, 0.10]
    y: [-0.34, -0.30]
    z: [0.0, 0.5]
  - name: "right_pillar"
    x: [0.06, 0.10]
    y: [0.30, 0.34]
    z: [0.0, 0.5]
  - name: "upper_pillar"
    x: [-0.40, 0.10]
    y: [-0.30, 0.30]
    z: [0.50, 0.55]

workspace_analysis:
  sampling_box:
    x: [0.2, 0.7]
    y: [-0.4, 0.4]
    z: [-0.1, 0.7]
  resolution: 0.05
